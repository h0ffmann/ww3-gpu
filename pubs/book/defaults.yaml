# pubs/book/defaults.yaml — pandoc defaults for the course book
from: gfm+tex_math_dollars+footnotes+definition_lists+attributes
to: pdf
pdf-engine: xelatex
top-level-division: chapter
number-sections: true
toc: true
toc-depth: 2
highlight-style: tango
filters:
  - pubs/filters/mermaid.lua
  - pubs/book/filters/symbols.lua
metadata:
  title: "Without Changing the Answer"
  subtitle: "Agentic coding and agentic research on a GPU port of WAVEWATCH III. A book in progress, compiled from github.com/h0ffmann/ww3-gpu: from the wave spectrum to GPUs, WW4 and SWAN"
  author: "Matheus Hoffmann"
  date: "2026-10"
  lang: en-US
  documentclass: book
  classoption: [a4paper, 11pt, openany]
  geometry: margin=2.5cm
  linkcolor: NavyBlue
  urlcolor: NavyBlue
  colorlinks: true
