# The label taxonomy, versioned: every label on h0ffmann/ww3-gpu, with its colour and description.
# ISSUE_LABELS.md says what each one means and when to use it. `just labels-sync` reconciles GitHub
# against this file with marola-devkit's issues.sh, and .github/workflows/labels.yml does the same
# on every push to main that changes it; GitHub's settings UI is no longer the source of truth.
#
# The shape is marola-devkit's and is parsed strictly by its scripts/issues.sh: one `- name:` per
# label, then `color:` and `description:`, in that order. Colours are lowercase hex without '#'.
# A sync creates and edits, never renames a label to another name and never deletes one without
# --prune: a rename is a `gh label edit --name` by hand first (ISSUE_LABELS.md, "Changing a label").

# --- GitHub's defaults, kept as GitHub ships them ---

- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"

- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"

- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"

- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"

- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"

- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"

- name: "invalid"
  color: "e4e669"
  description: "This doesn't seem right"

- name: "question"
  color: "d876e3"
  description: "Further information is requested"

- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"

# --- area/*: which part of the work, one or more per issue ---

- name: "area/kokkos"
  color: "1d76db"
  description: "The C++/Kokkos port: kernels, bind(C) shims, ports.tsv, port reports (kokkos/)"

