  color: "0e8a16"
  description: "WW3's own regtests: just smoke/full-ww3-gpu, the regtest matrix (regtests/), references"

- name: "area/parity"
  color: "5319e7"
  description: "Bit for bit with the Fortran: a test.comp difference, ww3_self, the GIMPLE comparison"

- name: "area/gpu"
  color: "76b900"
  description: "CUDA backend, GPU builds and GPU hardware (RTX 4090, H100)"

- name: "area/bench"
  color: "fbca04"
  description: "Timings and profiles: bench/, bench/results/, the timing column of PORT_STATUS.md"

- name: "area/nix"
  color: "7eb6e8"
  description: "The pinned toolchain: picasso shells, flake.nix, compilers, just prereqs"

- name: "area/docker"
  color: "0db7ed"
  description: "Container images, .devcontainer/, dbuild/drun, the Trivy scan"

- name: "area/ufsc"
  color: "006b75"
  description: "LabECO/UFSC: the H100 machine, its access and the co-advising"

- name: "area/proposal"
  color: "d4c5f9"
  description: "The UFRJ/DEL project proposal (pubs/proposal/), reviewed by revisor-proposta"

- name: "area/book"
  color: "e99695"
  description: "The book: course/ chapters, examples, exercises, the PDF and Leanpub builds"

- name: "area/noaa"
  color: "ededed"
  description: "NOAA announcements and upstream WW3/WW4 changes that affect this repo"

- name: "area/dev-tooling"
  color: "bfd4f2"
  description: "Agents, skills, hooks, CI and the scripts behind just, not the lab code"

# --- kind/*, size/*, priority/*: what sort of work, how big, how urgent ---

- name: "kind/research"
  color: "c5def5"
  description: "A spike, survey or evaluation: the output is findings, not shipped code"

- name: "size/S"
  color: "c5def5"
  description: "Under ~100 changed lines"

- name: "size/M"
  color: "c5def5"
  description: "Roughly 100-400 changed lines"

- name: "size/L"
  color: "c5def5"
  description: "Over ~400 lines: split it; only ever legal on a parent issue"

- name: "priority/high"
  color: "b60205"
  description: "Do before other open work of the same area"

# --- names automation depends on: rename only together with what reads them ---

- name: "wfip"
  color: "ededed"
  description: "Touches a WFIP or a spec; .github/labeler.yml sets it, release.yml gives it a heading"

