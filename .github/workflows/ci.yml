name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shell syntax
        run: |
          for f in $(git ls-files '*.sh'); do
            echo "-- $f"
            bash -n "$f"
          done

      # The Claude hooks only fire in Claude Code; this runs their checks for any harness.
      - name: Agent and skill definitions parse, the Claude hooks and the branch-name check pass their self-tests, the Oh My Pi copies are current
        run: |
          python3 .claude/hooks/check_agent_frontmatter.py
          bash .claude/hooks/proposal-review.sh --self-test
          bash .claude/hooks/proposal-review-stop.sh --self-test
          bash scripts/branch_name.sh --self-test
          test -f .agents/skills/eli5/SKILL.md
          python3 scripts/omp_sync.py --self-test
          python3 scripts/omp_sync.py --check

      # regtest-selected.yml runs on the owner's machine: only by hand, only by the owner.
      - name: Self-hosted workflows are dispatch-only and owner-only; the runner scripts pass their self-tests
        run: |
          bash scripts/runner.sh --self-test
          bash scripts/runner.sh check-workflows
          bash scripts/regtest_selected.sh --self-test

      - name: Figures have headers, reading cards and current renders
        run: python3 scripts/figures.py check

      - name: WFIP index, deliverables and definitions of done are current
        run: python3 scripts/wfip.py --self-test && python3 scripts/wfip.py check

      - name: Every reference of the proposal has a row and a verdict in its REFERENCES.md
        run: python3 scripts/refs_check.py --self-test && python3 scripts/refs_check.py

      - name: The slip box keeps its rules (NOTES.md)
        run: python3 scripts/notes_check.py --self-test && python3 scripts/notes_check.py

      - name: memory/ holds only published ai-memory pages, and its index is current (MEMORY.md)
        run: python3 scripts/memory.py --self-test && python3 scripts/memory.py check

      - name: Result records are valid, every timing has a passed WW3 regtest replay, quoted tables are current
        run: python3 scripts/results.py check

      - name: The port score in kokkos/PORT_STATUS.md is current; ww3-gpu.sh and ww4_parts.py pass their self-tests
        run: |
          python3 scripts/port_score.py --self-test
          python3 scripts/port_score.py --check
          bash scripts/ww3-gpu.sh --self-test
          bash scripts/ww3_base.sh --self-test
          python3 scripts/ww4_parts.py --self-test

      # The gate fails on the error-level rules of .vale.ini; the report prints the
      # judgement rules of .vale-report.ini for the reviewer and never fails.
      - name: Prose has no AI-writing tells (Vale, vale-ai-tells)
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && export PATH="$RUNNER_TEMP/bin:$PATH"
          curl -sSfL https://github.com/errata-ai/vale/releases/download/v3.15.2/vale_3.15.2_Linux_64-bit.tar.gz \
            | tar xz -C "$RUNNER_TEMP/bin" vale
          scripts/vale.sh --self-test
          scripts/vale.sh
          scripts/vale.sh --report --output=line | cut -d: -f4 | sort | uniq -c | sort -nr

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
        continue-on-error: true

      - name: Fortran compiles (CPU, directives ignored)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran
          # OpenACC directives are comments to gfortran, so these must still
          # be valid standard Fortran. 02_do_concurrent uses F2018 LOCAL(),
          # which older gfortran may reject -- allowed to fail.
          for f in gpu/00_hello_acc.f90 gpu/01_dispersion.f90 gpu/03_precision.f90 \
                   bench/kernel_bench.f90; do
            echo "-- $f"
            gfortran -O1 -fopenmp -c "$f" -o /dev/null
          done
          # hetero_split needs OpenACC async semantics that gfortran ignores;
          # it must still be valid standard Fortran with OpenMP.
          gfortran -O1 -fopenmp -c bench/hetero_split.f90 -o /dev/null || \
            echo "note: hetero_split needs nvfortran -acc -mp"
          gfortran -O1 -std=f2018 -c gpu/02_do_concurrent.f90 -o /dev/null || \
            echo "note: 02_do_concurrent needs a compiler with F2018 LOCAL() support"

      - name: Example Fortran compiles and runs
        run: |
          # The example-01 input generator needs nothing but gfortran, so it is
          # built and run here, strictly.
          gfortran -O2 -std=f2018 -Wall -Wextra -Werror -fimplicit-none \
            -o /tmp/make_inputs examples/01-fetch-limited-growth/make_inputs.F90
          (cd /tmp && ./make_inputs && test -s depth.inp && test -s mask.inp)
          # examples/02's make_bathy.F90 needs netcdf-fortran; its run.sh builds it
          # in the pinned nix shell rather than against the runner's apt state.

  kokkos:
    name: kokkos (${{ matrix.preset }})
    runs-on: ubuntu-latest
    # One job per preset, in parallel: each one is a full configure, build and test.
    strategy:
      fail-fast: false
      matrix:
        preset: [serial-debug, openmp-release]
    steps:
      # .gitmodules uses ssh URLs a runner cannot clone, hence https below.
      # --no-recommend-shallow: nix asks the flake input for revCount, which a
      # shallow clone cannot answer. The fallback fetches the pinned SHA directly
      # when it lives on a topic branch rather than the `branch = main` it tracks.
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: Fetch the pratico toolchain submodule
        run: |
          git -c url.https://github.com/.insteadOf=git@github.com: \
            submodule update --init --no-recommend-shallow picasso || {
            sha=$(git ls-tree HEAD picasso | awk '{print $3}')
            git -C picasso -c url.https://github.com/.insteadOf=git@github.com: \
              fetch origin "$sha"
            git -C picasso checkout -q "$sha"
          }

      - name: Fetch WW3's w3kokkosmd.F90 at the pinned WW3 commit (no full WW3 clone)
        run: |
          sha=$(git ls-tree HEAD WW3 | awk '{print $3}')
          mkdir -p WW3/model/src
          curl -fsSL "https://raw.githubusercontent.com/h0ffmann/WW3/$sha/model/src/w3kokkosmd.F90" \
            -o WW3/model/src/w3kokkosmd.F90

      # Upstream Nix; picasso's flake pins the toolchain it then builds. The store is cached by
      # the lock of the pratico flake: picasso's own packages (kokkos-openmp, ptscotch-static,
      # ww3-metis) are on no public cache and would otherwise build on every run. Only a push to
      # main saves, from one job, so a pull request never pays the upload.
      - uses: cachix/install-nix-action@v31
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-pratico-ww3-${{ runner.os }}-${{ hashFiles('picasso/labs/pratico/flake.nix', 'picasso/labs/pratico/flake.lock') }}
          restore-prefixes-first-match: nix-pratico-ww3-${{ runner.os }}-
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.preset == 'serial-debug' }}

      - name: ${{ matrix.preset }}
        env:
          PRESET: ${{ matrix.preset }}
        run: |
          nix develop ./picasso/labs/pratico#ww3 --command bash -c "
            cd kokkos &&
            cmake --preset $PRESET &&
            cmake --build --preset $PRESET &&
            ctest --preset $PRESET"

  links:
    name: markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 4 --accept 200,206,403,429 './**/*.md'
          fail: false
