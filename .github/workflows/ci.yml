name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          for f in $(git ls-files '*.sh'); do
            echo "-- $f"
            bash -n "$f"
          done

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
        continue-on-error: true

      - name: Fortran compiles (CPU, directives ignored)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran
          # OpenACC directives are comments to gfortran, so these must still
          # be valid standard Fortran. 02_do_concurrent uses F2018 LOCAL(),
          # which older gfortran may reject -- allowed to fail.
          for f in gpu/00_hello_acc.f90 gpu/01_dispersion.f90 gpu/03_precision.f90 \
                   bench/kernel_bench.f90; do
            echo "-- $f"
            gfortran -O1 -fopenmp -c "$f" -o /dev/null
          done
          # hetero_split needs OpenACC async semantics that gfortran ignores;
          # it must still be valid standard Fortran with OpenMP.
          gfortran -O1 -fopenmp -c bench/hetero_split.f90 -o /dev/null || \
            echo "note: hetero_split needs nvfortran -acc -mp"
          gfortran -O1 -std=f2018 -c gpu/02_do_concurrent.f90 -o /dev/null || \
            echo "note: 02_do_concurrent needs a compiler with F2018 LOCAL() support"

      - name: Example and exercise Fortran compiles and the parity test passes
        run: |
          # The example-01 input generator and the exercise-11 refactor need
          # nothing but gfortran, so they are built and run here, strictly.
          gfortran -O2 -std=f2018 -Wall -Wextra -Werror -fimplicit-none \
            -o /tmp/make_inputs examples/01-fetch-limited-growth/make_inputs.F90
          (cd /tmp && ./make_inputs && test -s depth.inp && test -s mask.inp)
          gfortran -O2 -std=f2018 -Wall -Wextra -Werror -fimplicit-none \
            -o /tmp/ex11_test exercises/solutions/ex11_refactor.F90 exercises/solutions/ex11_refactor_test.F90
          /tmp/ex11_test
          # examples/02's make_bathy.F90 needs netcdf-fortran; its run.sh builds it
          # in the pinned nix shell rather than against the runner's apt state.

  kokkos:
    name: kokkos (serial-debug + openmp-release)
    runs-on: ubuntu-latest
    steps:
      # .gitmodules uses ssh URLs a runner cannot clone, hence https below.
      # --no-recommend-shallow: nix asks the flake input for revCount, which a
      # shallow clone cannot answer. The fallback fetches the pinned SHA directly
      # when it lives on a topic branch rather than the `branch = main` it tracks.
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch the pratico toolchain submodule
        run: |
          git -c url.https://github.com/.insteadOf=git@github.com: \
            submodule update --init --no-recommend-shallow nix-config || {
            sha=$(git ls-tree HEAD nix-config | awk '{print $3}')
            git -C nix-config -c url.https://github.com/.insteadOf=git@github.com: \
              fetch origin "$sha"
            git -C nix-config checkout -q "$sha"
          }

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: serial-debug (sanitizers)
        run: |
          nix develop ./nix-config/labs/pratico#ww3 --command bash -c '
            cd kokkos &&
            cmake --preset serial-debug &&
            cmake --build --preset serial-debug &&
            ctest --preset serial-debug'

      - name: openmp-release
        run: |
          nix develop ./nix-config/labs/pratico#ww3 --command bash -c '
            cd kokkos &&
            cmake --preset openmp-release &&
            cmake --build --preset openmp-release &&
            ctest --preset openmp-release'

  links:
    name: markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 4 --accept 200,206,403,429 './**/*.md'
          fail: false
