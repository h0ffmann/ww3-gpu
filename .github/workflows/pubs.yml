# pubs — build every PDF with nix-config's labs/publisher action: unit tests and (on main, when
# TRANSLATE_* secrets exist) the EN -> PT translation as pre-build, then nix flake check,
# nix build, artifact upload, and on main a commit of pdf/ + pubs/proposal/pt back.
name: Publications

on:
  pull_request:
    paths: ['course/**', 'pubs/**', 'scripts/build_pdf.sh', 'scripts/book_prep.py', 'scripts/translate_md.py', 'tests/**', 'flake.nix', 'flake.lock', '.github/workflows/pubs.yml']
  push:
    branches: [main]
    paths: ['course/**', 'pubs/**', 'scripts/build_pdf.sh', 'scripts/book_prep.py', 'scripts/translate_md.py', 'tests/**', 'flake.nix', 'flake.lock', '.github/workflows/pubs.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: h0ffmann/nix-config/labs/publisher@main
        env:
          TRANSLATE_BASE_URL: ${{ secrets.TRANSLATE_BASE_URL }}
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_MODEL: ${{ secrets.TRANSLATE_MODEL }}
        with:
          # `all` now contains the course docx as well; the default glob would drop it.
          file-glob: "*"
          pre-build: |
            set -euo pipefail
            nix develop . --command python3 -m unittest discover -s tests -v
            if [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" = push ]; then
              if [ -n "${TRANSLATE_API_KEY:-}" ]; then nix develop . --command python3 scripts/translate_md.py
              else echo "no TRANSLATE_API_KEY secret — skipping translation, pt/ stays as committed"; fi
            fi
          commit: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          commit-paths: pubs/proposal/pt pubs/proposal/.translation-cache.json
