# weekly-release — every Monday, cut the next patch release when main has commits since the
# latest tag, the same as running `just release` by hand. A tag pushed with GITHUB_TOKEN does not
# start release.yml, so this job publishes the GitHub release itself; Zenodo's webhook then
# archives it and mints the version DOI. A week with nothing new makes no release (a DOI is
# permanent). Run it on demand from the Actions tab with "Run workflow".
name: Weekly release

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: check
        run: |
          prev="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          if [ "$(git rev-list --count "$prev..HEAD")" -eq 0 ]; then
            echo "::notice::Nothing new since $prev; no release this week."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          scripts/release.sh
          tag="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          gh release create "$tag" --verify-tag --generate-notes --title "$tag"
