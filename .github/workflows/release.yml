# release — pushing a `v*` tag publishes a GitHub release with generated notes. Zenodo's GitHub
# integration (enabled once at zenodo.org/account/settings/github) listens for published
# releases through its own webhook, archives the tagged source and mints a new version DOI.
# No secret is needed: the webhook belongs to Zenodo, and GITHUB_TOKEN creates the release.
# The notes open with `wfip.py status --since <previous tag>` (what the version moved against
# the proposal's deliverables), above GitHub's generated list of merged PRs.
name: Release

# It listens to `create`, not `push`: GitHub drops a push whose commit message says `[skip ci]`,
# and the tip of main is often the PDF bot's "ci: rebuild PDFs [skip ci]" (v0.1.1 got no release).
on: create

permissions:
  contents: write

jobs:
  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: WFIP status since the previous tag
        run: |
          prev=$(git tag -l 'v*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -n1)
          python3 scripts/wfip.py status ${prev:+--since "$prev"} > "$RUNNER_TEMP/notes.md"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --notes-file "$RUNNER_TEMP/notes.md" --title "$GITHUB_REF_NAME"

  # The preprint's arXiv source bundle, attached to the release for the author to upload at
  # arxiv.org/submit (arXiv has no submission API for authors; arxiv.yml says why). A separate
  # job, so a TeX failure never holds back the release or Zenodo's DOI.
  arxiv-bundle:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      # TeX Live 2023 from its own image (texlive/texlive:TL2023-historic, pinned by digest), the
      # version the bundle's 00README asks arXiv for. Not apt: on 2026-11-11 every runner failed to
      # resolve azure.archive.ubuntu.com, and apt-get install hung until the job timed out.
      - name: Build the bundle and compile it in TeX Live 2023
        timeout-minutes: 15
        env:
          IMAGE: texlive/texlive@sha256:43f34cbfd1fdec61e3fa1413c3f29a434715431627734461aacb6896482a4b63
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -e PREPRINT_REV="$(git rev-parse --short HEAD)+$(git rev-list --count HEAD)" \
            -e PREPRINT_MTIME="$(git log -1 --format=%ct)" \
            -v "$PWD:/w" -w /w "$IMAGE" bash scripts/preprint_arxiv.sh --out build/arxiv
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" build/arxiv/wave-models-on-gpus-arxiv.tar.gz
