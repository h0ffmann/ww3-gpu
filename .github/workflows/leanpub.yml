# leanpub — the free Leanpub edition of the book, as CI/CD (WFIP-0002 §5.7, docs/LEANPUB_202610.md).
# On every push to main that changes a chapter, a render or the exporter, and on every published
# release: export course/*.md as a Markua manuscript (scripts/leanpub_manuscript.py) and push it
# as the single commit of the `leanpub` branch, which the Leanpub book reads in its Git and GitHub
# writing mode (repo h0ffmann/ww3-gpu, branch leanpub, folder manuscript/). Leanpub never writes to
# the repository. Then, when the LEANPUB_API_KEY secret exists (the API needs a Pro author plan),
# ask Leanpub for a preview on a push and publish on a release; without the secret the push to
# `leanpub` is the whole job and a person clicks Preview or Publish on leanpub.com, or a Leanpub
# webhook on the repository does it (docs/LEANPUB_202610.md, step 5). The book's URL slug is the
# repository variable LEANPUB_BOOK_SLUG (default: without-changing-the-answer).
name: Leanpub

on:
  push:
    branches: [main]
    paths: ['course/**', 'pubs/book/parts.json', 'pubs/figures/mermaid/**', 'scripts/leanpub_manuscript.py', '.github/workflows/leanpub.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency: leanpub

jobs:
  manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Export the manuscript
        run: |
          python3 scripts/leanpub_manuscript.py --self-test
          python3 scripts/leanpub_manuscript.py --out "$RUNNER_TEMP/leanpub"
      - name: Push it as the `leanpub` branch
        run: |
          cd "$RUNNER_TEMP/leanpub"
          printf '%s\n' "# Leanpub manuscript" "" \
            "Generated by .github/workflows/leanpub.yml from main@${GITHUB_SHA::7}; do not edit here." \
            "Edit course/*.md on main. Leanpub reads manuscript/ of this branch." > README.md
          git init -q -b leanpub
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "leanpub manuscript from main@${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" leanpub
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Ask Leanpub for a preview (push) or a publish (release), when the API key exists
        if: ${{ env.LEANPUB_API_KEY != '' }}
        env:
          LEANPUB_API_KEY: ${{ secrets.LEANPUB_API_KEY }}
          SLUG: ${{ vars.LEANPUB_BOOK_SLUG || 'without-changing-the-answer' }}
        run: |
          if [ "${{ github.event_name }}" = release ]; then
            curl -sSf -X POST "https://leanpub.com/$SLUG/publish.json" \
              -d "api_key=$LEANPUB_API_KEY" \
              -d "publish[email_readers]=true" \
              --data-urlencode "publish[release_notes]=${{ github.event.release.tag_name }}: ${{ github.event.release.html_url }}"
          else
            curl -sSf -X POST "https://leanpub.com/$SLUG/preview.json" -d "api_key=$LEANPUB_API_KEY"
          fi
