# pages — the website on GitHub Pages (issue #76, ADR-0004 decision 6, ADR-0009).
# The front page, /, is Gleam + Lustre (site/, DESIGN.md): scripts/build_site.sh prerenders it in
# `nix develop .#site`, its facts read from the repository (the ADRs, the WFIPs, the notes,
# .zenodo.json, RELEASES.md). scripts/build_html.sh adds the progress page pubs/site/andamento/,
# the ADR list pubs/site/adrs/, which scripts/adrs.py fills from docs/ADRs.md at build time, and the
# GTA report, at their old URLs.
# A pull request only builds it, so a change that breaks the site fails there; a push to main,
# a published release or a manual run also deploys it to https://h0ffmann.github.io/ww3-gpu/.
# Needs the repository's Pages source set to "GitHub Actions" (Settings -> Pages), once.
name: Pages

on:
  pull_request:
    paths: ['pubs/site/**', 'pubs/relatorio-gta/**', 'scripts/build_relatorio.sh', 'scripts/build_html.sh', 'scripts/build_site.sh', 'docs/ADRs.md', 'docs/WFIPs/**', 'notes/**', 'site/**', 'DESIGN.md', '.zenodo.json', 'CITATION.cff', 'RELEASES.md', 'flake.nix', 'flake.lock', 'scripts/adrs.py', '.github/workflows/pages.yml']
  push:
    branches: [main]
    paths: ['pubs/site/**', 'pubs/relatorio-gta/**', 'scripts/build_relatorio.sh', 'scripts/build_html.sh', 'scripts/build_site.sh', 'docs/ADRs.md', 'docs/WFIPs/**', 'notes/**', 'site/**', 'DESIGN.md', '.zenodo.json', 'CITATION.cff', 'RELEASES.md', 'flake.nix', 'flake.lock', 'scripts/adrs.py', '.github/workflows/pages.yml']
  release:
    types: [published]
  # pubs.yml commits the rebuilt PDF with [skip ci], which starts no push run; redeploy after it.
  workflow_run:
    workflows: [Publications]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false # a deploy cut halfway leaves Pages on neither version

jobs:
  build:
    # pandoc from the runner's apt, for the GTA report's pages.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        # no token left in .git/config for the node code of vendor/archify that runs below
        with: { fetch-depth: 0, persist-credentials: false } # the page names the commit it was read from
      - run: sudo apt-get update && sudo apt-get install -y pandoc && pandoc --version | head -1
      - run: bash scripts/build_html.sh
      # The front page: Gleam, node and esbuild from picasso's gleam-website lab, pinned in flake.lock.
      - uses: cachix/install-nix-action@v31
      - run: nix develop --no-update-lock-file .#site --command scripts/build_site.sh --check
      # The drawings of docs/archify/dark.tsv as pages at /figures/<slug>/ (DESIGN.md, "Pictures").
      # node and Chrome are the runner's; Archify is the pinned submodule.
      - run: bash scripts/archify.sh init && bash scripts/archify.sh site build/site/figures
      - uses: actions/upload-pages-artifact@v5
        with: { path: build/site }

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
