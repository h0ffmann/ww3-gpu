# arxiv — build the preprint's arXiv source bundle and compile it with xelatex from a clean
# directory, as arXiv will (scripts/preprint_arxiv.sh). arXiv takes uploads from authors only
# through its web form (SWORD is for approved proxies), so the workflow never contacts arXiv:
# it leaves the tarball as an artifact, and release.yml attaches it to each GitHub release.
name: arXiv bundle

on:
  pull_request:
    paths: ['pubs/preprint/**', 'scripts/preprint_arxiv.sh', '.github/workflows/arxiv.yml']
  push:
    branches: [main]
    paths: ['pubs/preprint/**', 'scripts/preprint_arxiv.sh', '.github/workflows/arxiv.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - run: bash scripts/preprint_arxiv.sh --self-test
      # TeX Live 2023 from its own image (texlive/texlive:TL2023-historic, pinned by digest), the
      # version the bundle's 00README asks arXiv for. Not apt: on 2026-11-11 every runner failed to
      # resolve azure.archive.ubuntu.com, and apt-get install hung until the job timed out.
      - name: Build the bundle and compile it in TeX Live 2023
        timeout-minutes: 15
        env:
          IMAGE: texlive/texlive@sha256:43f34cbfd1fdec61e3fa1413c3f29a434715431627734461aacb6896482a4b63
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -e PREPRINT_REV="$(git rev-parse --short HEAD)+$(git rev-list --count HEAD)" \
            -e PREPRINT_MTIME="$(git log -1 --format=%ct)" \
            -v "$PWD:/w" -w /w "$IMAGE" bash scripts/preprint_arxiv.sh --out build/arxiv
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arxiv-bundle
          path: build/arxiv/
