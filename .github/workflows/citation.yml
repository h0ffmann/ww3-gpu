# citation — validate CITATION.cff with cffconvert, maintained by the Citation File Format
# project, check that .zenodo.json parses, and that codemeta.json (derived from both by
# scripts/codemeta.py) is current, so a broken or stale file never reaches a release.
name: Citation metadata

on:
  pull_request:
    paths: [CITATION.cff, .zenodo.json, codemeta.json, scripts/codemeta.py]
  push:
    branches: [main]
    paths: [CITATION.cff, .zenodo.json, codemeta.json, scripts/codemeta.py]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: --validate
      - run: python3 -m json.tool .zenodo.json > /dev/null
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml && python3 scripts/codemeta.py --check
