# citation — validate CITATION.cff with cffconvert, maintained by the Citation File Format
# project, and check that .zenodo.json parses, so a broken file never reaches a release.
name: Citation metadata

on:
  pull_request:
    paths: [CITATION.cff, .zenodo.json]
  push:
    branches: [main]
    paths: [CITATION.cff, .zenodo.json]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: --validate
      - run: python3 -m json.tool .zenodo.json > /dev/null
