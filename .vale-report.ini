# Every ai-tells rule, as suggestions for a person to weigh (scripts/vale.sh
# --report). The package ships each rule at level error; nothing here fails CI.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

[*.md]
BasedOnStyles = ai-tells, ww3gpu
# Colons and semicolons carry definitions, lists and file:line in technical
# prose; the two rules flag 764 of the 1 669 alerts at the baseline.
ai-tells.ColonUsage = NO
ai-tells.SemicolonUsage = NO
# Replaced by ww3gpu.EmDash, which leaves the en dash of a range alone.
ai-tells.EmDashUsage = NO
