# The ASD-STE100 checks (scripts/vale.sh --ste), reported for a person and never a gate: the
# rules are warnings and suggestions, so .vale.ini (MinAlertLevel = error) does not see them.
# The ste skill applies STE to procedures, runbooks and reports, not to every page.
StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = STE
